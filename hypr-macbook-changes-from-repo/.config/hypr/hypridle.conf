# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoids starting multiple lock instances
    before_sleep_cmd = loginctl lock-session    # Locks session before your PC goes to sleep
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # Turns display back on after waking up

}

# 1. Dim monitor backlight (2 min)
listener {
    timeout = 120
    on-timeout = brightnessctl set 10%-
    on-resume = brightnessctl set 10%+
}

# 3. Lock screen (5 min)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 4. Turn off screen completely (5.5 min)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })' # Turns the screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # Turns the screen on
}

# 5. Suspend PC (10 min)
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
